<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversor de Maiúsculas e Minúsculas</title>
<meta name="description" content="Converta texto para MAIÚSCULAS, minúsculas, Primeira Letra Maiúscula, frase, alternado, sem acentos e mais. Tudo no navegador.">
<meta property="og:title" content="Conversor de Maiúsculas e Minúsculas">
<meta property="og:description" content="Cole o texto, escolha o formato e copie. Sem cadastro, sem enviar nada pra internet.">
<meta property="og:image" content="preview.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#2a2f3a;
    --fg:#eef1f6; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#7c5cff; --ok:#2ecc71;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;justify-content:center;padding:32px 16px}
  main{width:100%;max-width:860px}
  header{margin-bottom:22px}
  h1{font-size:clamp(1.5rem,4vw,2.1rem);letter-spacing:-.02em}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);margin-top:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  textarea{width:100%;min-height:220px;resize:vertical;background:var(--card2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:14px;font-family:inherit;font-size:16px;line-height:1.5;outline:none}
  textarea:focus{border-color:var(--accent)}
  .stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:.85rem;margin:10px 2px 16px}
  .stats b{color:var(--fg);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--card2);color:var(--fg);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:.92rem;font-weight:600;transition:.15s}
  button:hover{border-color:var(--accent);transform:translateY(-1px)}
  button:active{transform:none}
  .acoes{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .primario{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none}
  .acoes button{flex:1;min-width:140px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:var(--ok);color:#06210f;font-weight:700;padding:10px 18px;border-radius:999px;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:18px}
  kbd{background:var(--card2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.75rem}
</style>
</head>
<body>
<main>
  <header>
    <h1>Conversor de <span>Maiúsculas e Minúsculas</span></h1>
    <p>Cole o texto, clique no formato e copie. Nada sai do seu navegador.</p>
  </header>

  <section class="card">
    <label for="texto" style="position:absolute;left:-9999px">Texto</label>
    <textarea id="texto" placeholder="Digite ou cole seu texto aqui..." autofocus></textarea>
    <div class="stats">
      <span><b id="nCaracteres">0</b> caracteres</span>
      <span><b id="nPalavras">0</b> palavras</span>
      <span><b id="nLinhas">0</b> linhas</span>
    </div>

    <div class="grid">
      <button data-modo="maiusculas">MAIÚSCULAS</button>
      <button data-modo="minusculas">minúsculas</button>
      <button data-modo="titulo">Primeira Letra Maiúscula</button>
      <button data-modo="frase">Tipo frase. Assim.</button>
      <button data-modo="inverter">iNVERTER cAIXA</button>
      <button data-modo="alternado">aLtErNaDo</button>
      <button data-modo="semAcento">Sem acentos</button>
      <button data-modo="espacos">Limpar espaços</button>
    </div>

    <div class="acoes">
      <button class="primario" id="copiar">Copiar texto</button>
      <button id="desfazer">Desfazer</button>
      <button id="limpar">Limpar</button>
    </div>
  </section>

  <footer>Atalhos: <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>U</kbd> maiúsculas · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd> minúsculas · feito por oDavyy</footer>
</main>
<div class="toast" id="toast"></div>

<script>
  const campo = document.getElementById('texto');
  const historico = [];
  // palavras que ficam minúsculas no meio de um título em português
  const pequenas = new Set(['a','à','ao','aos','as','às','com','da','das','de','do','dos','e','em','na','nas','no','nos','o','os','ou','para','pela','pelas','pelo','pelos','por','um','uma']);

  const modos = {
    maiusculas: t => t.toLocaleUpperCase('pt-BR'),
    minusculas: t => t.toLocaleLowerCase('pt-BR'),
    titulo: t => t.toLocaleLowerCase('pt-BR').replace(/[\p{L}\p{N}]+/gu, (p, i) => {
      const inicioLinha = i === 0 || /[\n.!?:]\s*$/.test(t.slice(0, i));
      if (!inicioLinha && pequenas.has(p)) return p;
      return p.charAt(0).toLocaleUpperCase('pt-BR') + p.slice(1);
    }),
    frase: t => t.toLocaleLowerCase('pt-BR').replace(/(^\s*|[.!?]\s+|\n\s*)(\p{L})/gu, (m, sep, l) => sep + l.toLocaleUpperCase('pt-BR')),
    inverter: t => [...t].map(c => c === c.toLocaleUpperCase('pt-BR') ? c.toLocaleLowerCase('pt-BR') : c.toLocaleUpperCase('pt-BR')).join(''),
    alternado: t => { let n = 0; return [...t].map(c => /\p{L}/u.test(c) ? (n++ % 2 ? c.toLocaleUpperCase('pt-BR') : c.toLocaleLowerCase('pt-BR')) : c).join(''); },
    semAcento: t => t.normalize('NFD').replace(/[̀-ͯ]/g, ''),
    espacos: t => t.split('\n').map(l => l.replace(/[ \t]+/g, ' ').trim()).join('\n').replace(/\n{3,}/g, '\n\n').trim()
  };

  function aplicar(modo) {
    if (!campo.value) return aviso('Digite algum texto primeiro');
    historico.push(campo.value);
    if (historico.length > 50) historico.shift();
    campo.value = modos[modo](campo.value);
    contar();
  }

  function contar() {
    const t = campo.value;
    document.getElementById('nCaracteres').textContent = [...t].length;
    document.getElementById('nPalavras').textContent = (t.match(/[\p{L}\p{N}]+(?:['-][\p{L}\p{N}]+)*/gu) || []).length;
    document.getElementById('nLinhas').textContent = t ? t.split('\n').length : 0;
  }

  let tempo;
  function aviso(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(tempo); tempo = setTimeout(() => el.classList.remove('show'), 1800);
  }

  async function copiar() {
    if (!campo.value) return aviso('Nada para copiar');
    try { await navigator.clipboard.writeText(campo.value); }
    catch { campo.select(); document.execCommand('copy'); }
    aviso('Copiado! ✓');
  }

  document.querySelectorAll('[data-modo]').forEach(b => b.addEventListener('click', () => aplicar(b.dataset.modo)));
  document.getElementById('copiar').addEventListener('click', copiar);
  document.getElementById('desfazer').addEventListener('click', () => {
    if (!historico.length) return aviso('Nada para desfazer');
    campo.value = historico.pop(); contar();
  });
  document.getElementById('limpar').addEventListener('click', () => {
    if (campo.value) historico.push(campo.value);
    campo.value = ''; contar(); campo.focus();
  });
  campo.addEventListener('input', contar);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'u') { e.preventDefault(); aplicar('maiusculas'); }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'l') { e.preventDefault(); aplicar('minusculas'); }
  });
  contar();
</script>
</body>
</html>
